---
- name: Configure the web server
  hosts: web
  become: true

  tasks:
    - name: Update apt cache and install Docker
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Authorize GitHub Actions deployment key
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ lookup('file', playbook_dir + '/github_actions_deploy.pub') | trim }}"
        create: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'
