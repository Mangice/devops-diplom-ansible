---
- name: Install Docker on the web server
  hosts: web
  become: true

  tasks:
    - name: Update apt cache and install Docker
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true
